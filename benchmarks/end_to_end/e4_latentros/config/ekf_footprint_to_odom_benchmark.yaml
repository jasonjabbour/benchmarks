footprint_to_odom_ekf:
  ros__parameters:
    # High frequency → effectively event-driven (publish per input)
    frequency: 1000.0
    publish_tf: false
    transform_timeout: 0.01
    two_d_mode: true

    # Remapped: input component publishes to this topic
    odom0: /robotperf/benchmark/odom_input
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]

    imu0: imu/data
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, true,
                  false, false, false]

    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom
