base_to_footprint_ekf:
  ros__parameters:
    # High frequency → effectively event-driven (publish per input)
    frequency: 1000.0
    publish_tf: false
    transform_timeout: 0.01
    transform_time_offset: 0.045
    two_d_mode: false

    # Remapped: input component publishes to this topic
    pose0: /robotperf/benchmark/pose_cov_input
    pose0_config: [true,  true,  true,
                   true,  true,  true,
                   false, false, false,
                   false, false, false,
                   false, false, false]

    imu0: imu/data
    imu0_config: [false, false, false,
                  false, false, false,
                  true,  true,  true,
                  false, false, false,
                  false, false, false]

    odom_frame: base_footprint
    world_frame: base_footprint
